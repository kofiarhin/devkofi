server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runs behind Beast's Nginx: keep redirects relative so they never leak
    # the container port or drop the public HTTPS scheme.
    absolute_redirect off;

    # Vite hashed assets: safe to cache long-term; missing files are real 404s.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached so new builds are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router: unknown paths fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
