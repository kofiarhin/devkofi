# Existing Beast DevKofi topology. Change only after checking live production.
DEPLOY_PROJECT=devkofi
DEPLOY_BRANCH=main
DEPLOY_REMOTE=github.com/kofiarhin/devkofi
DEPLOY_FRONTEND_SERVICE=devkofi-frontend
DEPLOY_API_SERVICE=devkofi-api
DEPLOY_FRONTEND_IMAGE=devkofi-frontend
DEPLOY_API_IMAGE=devkofi-api
DEPLOY_DOCKER="${DEVKOFI_DOCKER:-sudo -n docker}"
DEPLOY_ENV_FILE="${DEVKOFI_ENV_FILE:-/etc/devkofi/production.env}"
DEPLOY_KEEP_RELEASES=3
DEPLOY_HEALTH_RETRIES=24
DEPLOY_HEALTH_DELAY=5
