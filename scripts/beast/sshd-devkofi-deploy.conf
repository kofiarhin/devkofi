# Template only: Phase 2 installs it as /etc/ssh/sshd_config.d/99-devkofi-deploy.conf
# (root:root 0644, checked with sshd -t). Applies only to devkofi-deploy: public key only,
# forced command, no TTY, forwarding, tunnels or user rc files. Other accounts are unaffected.
Match User devkofi-deploy
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ForceCommand /usr/local/sbin/devkofi-deploy-ssh
    PermitTTY no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
    MaxSessions 1
