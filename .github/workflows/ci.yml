name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Production runs on Beast via Docker Compose (see docs/deployment/beast-docker.md).
# The legacy Namecheap FTP and Heroku deploy jobs were retired after the Docker cutover.
jobs:
  validate_backend:
    name: Validate backend
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/devkofi_test
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/devkofi_test
      JWT_SECRET: ci-test-jwt-secret
      ADMIN_EMAIL: admin-ci@example.com
      ADMIN_PASSWORD: ci-test-password
      CLIENT_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test
