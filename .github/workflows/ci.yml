name: Deploy client and backend

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy_client:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build client
        working-directory: client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Upload dist to Namecheap (root public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ${{ secrets.FTP_PROTOCOL }}
          local-dir: client/dist/
          server-dir: /
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**

  verify_live:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [deploy_client]
    timeout-minutes: 5

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright & Chromium
        run: |
          npm init -y
          npm install -D @playwright/test
          npx playwright install --with-deps chromium

      - name: Create Playwright Config & Test
        run: |
          cat > playwright.config.js <<'EOF'
          import { defineConfig, devices } from '@playwright/test';

          export default defineConfig({
            testDir: '.',
            use: { trace: 'on-first-retry' },
            projects: [
              {
                name: 'chromium',
                use: { ...devices['Desktop Chrome'] },
              },
            ],
          });
          EOF

          cat > production.spec.js <<'EOF'
          import { test, expect } from '@playwright/test';

          test('devkofi.com returns 200', async ({ page }) => {
            const response = await page.goto('https://devkofi.com', {
              waitUntil: 'domcontentloaded',
              timeout: 30000,
            });

            console.log('Status Code:', response?.status());
            expect(response?.status()).toBe(200);
          });
          EOF

      - name: Run Playwright smoke test
        run: |
          npx playwright test production.spec.js --project=chromium --reporter=list

  validate_backend:
    name: Validate backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  deploy_backend:
    name: Deploy backend to Heroku
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [validate_backend]
    environment: Production
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_APP_NAME: devkofi-api
      HEROKU_HEALTH_URL: https://devkofi-api-82532bf8b693.herokuapp.com/api/health

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate Heroku credential
        shell: bash
        run: |
          set -euo pipefail
          : "${HEROKU_API_KEY:?HEROKU_API_KEY secret is required}"

      - name: Install Heroku CLI
        shell: bash
        run: |
          set -euo pipefail
          curl https://cli-assets.heroku.com/install.sh | sh

      - name: Verify Heroku authentication
        shell: bash
        run: |
          set -euo pipefail
          heroku auth:whoami

      - name: Configure Heroku Git remote
        shell: bash
        run: |
          set -euo pipefail
          heroku git:remote --app "$HEROKU_APP_NAME"

      - name: Deploy validated revision
        shell: bash
        run: |
          set -euo pipefail
          git push heroku HEAD:main --force

      - name: Verify backend health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            status="$(curl --silent --show-error --output /tmp/devkofi-health.json --write-out '%{http_code}' "$HEROKU_HEALTH_URL" || true)"
            if [ "$status" = "200" ]; then
              cat /tmp/devkofi-health.json
              exit 0
            fi
            echo "Health check attempt $attempt returned HTTP $status"
            sleep 10
          done
          cat /tmp/devkofi-health.json 2>/dev/null || true
          exit 1
