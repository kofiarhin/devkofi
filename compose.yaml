services:
  devkofi-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: devkofi-frontend:local
    ports:
      - "127.0.0.1:${DEVKOFI_FRONTEND_PORT:-8082}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=4m
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  devkofi-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: devkofi-api:local
    network_mode: host
    env_file:
      - ${DEVKOFI_ENV_FILE:?Set DEVKOFI_ENV_FILE to the absolute path of the existing VPS environment file}
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: ${DEVKOFI_PORT:-4001}
    restart: unless-stopped
    mem_limit: 300m
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
